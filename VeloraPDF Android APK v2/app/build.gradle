plugins {
  id "com.android.application"
}

android {
  namespace "com.mutlukurt.velorapdf.webapk"
  compileSdk 35

  defaultConfig {
    applicationId "com.mutlukurt.velorapdfmobile"
    minSdk 24
    targetSdk 35
    versionCode 23
    versionName "2.1.2"
  }

  splits {
    abi {
      enable true
      reset()
      include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
      universalApk false
    }
  }

  signingConfigs {
    release {
      storeFile file("debug.keystore")
      storePassword "android"
      keyAlias "androiddebugkey"
      keyPassword "android"
    }
  }

  buildTypes {
    release {
      signingConfig signingConfigs.release
      minifyEnabled false
      shrinkResources false
    }
  }

  externalNativeBuild {
    cmake {
      path "src/main/cpp/CMakeLists.txt"
    }
  }
}

dependencies {
  implementation "androidx.webkit:webkit:1.12.1"
}
