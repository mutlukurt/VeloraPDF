[package]
name = "velora-pdf"
version = "1.0.1"
description = "Velora PDF"
authors = ["Velora PDF"]
edition = "2021"

[lib]
name = "velora_pdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
